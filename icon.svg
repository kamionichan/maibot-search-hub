<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>MaiBot 搜索中枢</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- 镜柄：与镜框同宽 -->
  <line x1="166" y1="166" x2="208" y2="208" stroke="#ffffff" stroke-width="28" stroke-linecap="round"/>
  <!-- 镜框：镜片填充比底色略深，让白色节点更突出 -->
  <circle cx="112" cy="112" r="76" fill="#1e1b4b" fill-opacity="0.28" stroke="#ffffff" stroke-width="20"/>
  <!-- 镜片里的编排节点：三个来源汇到中心。整体收在镜片中央，外圈节点离镜框留一个节点直径 -->
  <g stroke="#ffffff" stroke-width="9" stroke-linecap="round">
    <line x1="112" y1="116" x2="82" y2="88"/>
    <line x1="112" y1="116" x2="144" y2="89"/>
    <line x1="112" y1="116" x2="112" y2="153"/>
  </g>
  <g fill="#ffffff">
    <circle cx="82" cy="88" r="12"/>
    <circle cx="144" cy="89" r="12"/>
    <circle cx="112" cy="153" r="12"/>
  </g>
  <circle cx="112" cy="116" r="18" fill="#ffd166" stroke="#ffffff" stroke-width="5"/>
</svg>
